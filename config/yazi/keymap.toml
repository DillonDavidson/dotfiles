[[mgr.prepend_keymap]]
on  = [ "e" ]
run = "open"

[[mgr.prepend_keymap]]
on  = [ "d" ]
run = "yank --cut"

[[mgr.prepend_keymap]]
on  = [ "z", "h" ]
run = "hidden toggle"

[[mgr.prepend_keymap]]
on  = [ "c" ]
run = "escape --all"

[[mgr.append_keymap]]
on  = [ "g", "D" ]
run = "cd /home/dillon/Downloads"

[[mgr.append_keymap]]
on  = [ "g", "v" ]
run = "cd /home/dillon/Videos"

[[mgr.append_keymap]]
on  = [ "g", "s" ]
run = "cd /home/dillon/Documents/Subtitles/subtitles"

[[mgr.append_keymap]]
on  = [ "g", "a" ]
run = "cd \"/home/dillon/.local/share/Anki2/Sentence Banking/collection.media\""

[[mgr.append_keymap]]
on  = [ "q" ]
run = "quit"
