font=JetBrainsMono Nerd Font:size=25
line-height=40
fields=name,generic,comment,categories,filename,keywords
terminal=foot -e
layer=overlay
lines=15
width=35


[colors]
background=1e1e2eaa
text=cdd6f4ff
match=f38ba8ff
selection=585b70ff
selection-match=f38ba8ff
selection-text=cdd6f4ff
border=b4befeff

[border]
radius=20
width=3

[key-bindings]
delete-line-forward = none
next = Down Control+j
prev = Up Control+k
next-page = Shift+j
prev-page = Shift+k
